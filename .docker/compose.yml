# Two testbeds share one database server. `app` installs the framework alone,
# so the module is proven to work without its optional integrations; the
# `modules` profile's `app-modules` adds the CMS (Versioned) and Fluent.
x-app: &app
  ports:
    # Loopback only: SS_ENVIRONMENT_TYPE is dev, so the whole unauthenticated
    # /dev/* surface is live. Docker publishes on 0.0.0.0 by default and its
    # iptables rules bypass most host firewalls.
    - "127.0.0.1:${WEB_PORT}:443"
  volumes:
    - ../composer.json:/module/composer.json:ro
    - ../src:/module/src
    - ../tests:/module/tests:ro
    - ../coverage:/app/coverage
    - vendor:/app/vendor
  # Bounded restarts: a crash mid-run comes back, a container that cannot start
  # still fails the job promptly.
  restart: on-failure:3
  healthcheck:
    # The marker says the bootstrap finished; the curl says frankenphp accepts
    # connections. The entrypoint writes the marker before it `exec`s the server.
    test: test -f /tmp/.app-ready && curl -sSk -o /dev/null https://localhost/
    interval: 3s
    start_period: 60s
    retries: 20
  depends_on:
    db:
      condition: service_healthy
  environment: &app-env
    SS_DATABASE_SERVER: db
    SS_DATABASE_NAME: silverstripe
    SS_DATABASE_USERNAME: silverstripe
    SS_DATABASE_PASSWORD: silverstripe
    SS_DEFAULT_ADMIN_USERNAME: admin
    SS_DEFAULT_ADMIN_PASSWORD: admin
    SS_ENVIRONMENT_TYPE: dev
    SS_PHPUNIT_FLUSH: 1

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}

  app-modules:
    <<: *app
    profiles: [modules]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        COMPOSER_FILE: app/composer.modules.json
        COMPOSER_LOCK: app/composer.modules.lock
        WITH_CMS: 1
    ports:
      - "127.0.0.1:${MODULES_WEB_PORT}:443"
    volumes:
      - ../composer.json:/module/composer.json:ro
      - ../src:/module/src
      - ../tests:/module/tests:ro
      - ../coverage:/app/coverage
      - vendor-modules:/app/vendor
    environment:
      <<: *app-env
      SS_DATABASE_NAME: silverstripe_modules

  db:
    image: mysql:8
    # Throwaway test/dev data, and SapphireTest creates a temp database per test
    # class: trade crash-safety for speed. Measured 24% faster on grid's suite.
    command:
      - --skip-log-bin
      - --innodb-flush-log-at-trx-commit=0
      - --sync-binlog=0
      - --innodb-doublewrite=0
      - --performance-schema=0
    ports:
      # Loopback only: the credentials below are fixed dev defaults.
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_DATABASE: silverstripe
      MYSQL_USER: silverstripe
      MYSQL_PASSWORD: silverstripe
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 5s
      retries: 10

volumes:
  vendor:
  vendor-modules:
  db-data:
